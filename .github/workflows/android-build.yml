name: Build Android APK

on:
  workflow_dispatch:   # تشغيل يدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل الملفات من المستودع
        uses: actions/checkout@v4

      - name: فك ضغط ملف المشروع
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip
          unzip -q project.zip -d extracted
          # إذا كان المشروع داخل مجلد فرعي انقل محتوياته للجذر
          if [ -d extracted/project ]; then
            mv extracted/project/* extracted/project/.[!.]* . 2>/dev/null || true
          else
            mv extracted/* extracted/.[!.]* . 2>/dev/null || true
          fi
          ls -la

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: تثبيت حزم المشروع
        run: npm install

      - name: بناء ملفات الويب
        run: npm run build

      - name: مزامنة Capacitor
        run: npx cap sync android

      - name: صلاحية تنفيذ Gradle
        run: chmod +x android/gradlew

      - name: بناء APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
